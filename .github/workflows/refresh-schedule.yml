name: Refresh weekly food truck schedule

on:
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/refresh-schedule.yml"
      - "scripts/refresh-schedule.mjs"
      - "tests/refresh-schedule.test.mjs"
      - "package.json"

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-food-truck-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TZ: America/Los_Angeles
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser automation
        run: |
          npm install --no-package-lock
          npx playwright install --with-deps chromium

      - name: Test schedule updater
        run: npm test

      - name: Refresh all venue schedules
        run: npm run refresh

      - name: Commit complete schedule
        run: |
          if git diff --quiet -- data/schedule.js; then
            echo "The current week is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.js
          git commit -m "Refresh weekly food truck schedule"
          git push

      - name: Report failed refresh
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Weekly food truck schedule refresh failed"
          body="The automated Monday refresh failed and did not publish partial data. Review this run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          issue="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
